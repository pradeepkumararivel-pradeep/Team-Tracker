name: TeamTracker CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Backend Dependencies
        working-directory: ./server
        run: npm install

      - name: Run Backend Tests
        working-directory: ./server
        run: npm test
        env:
          MONGO_URI: mongodb://localhost:27017/teamtracker_test
          JWT_SECRET: ci_test_secret_key
          NODE_ENV: test

      - name: Install Frontend Dependencies
        working-directory: ./client
        run: npm install

      - name: Build Frontend
        working-directory: ./client
        run: npm run build

      - name: Validate Docker Compose
        run: docker compose config
